name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build checksum
        run: sha256sum remote-media-fallback.php > remote-media-fallback.php.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          remote-media-fallback.php
          remote-media-fallback.php.sha256
          --generate-notes
